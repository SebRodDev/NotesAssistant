[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purdue-study-assistant"
version = "0.1.0"
description = "A local-first desktop study assistant for lecture PDFs"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "PyMuPDF>=1.24,<2",
    "google-genai>=1.75,<2",
    "keyring>=25,<26",
]

[project.optional-dependencies]
macos = ["pyinstaller>=6,<7"]

[project.scripts]
study-assistant = "study_assistant.app:main"

[tool.setuptools.packages.find]
include = ["study_assistant*"]
