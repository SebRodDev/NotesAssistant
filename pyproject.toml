[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purdue-study-assistant"
version = "2.0.0"
description = "Cortex: an offline, Ollama-powered chat interface for your lecture notes"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
macos = ["pyinstaller>=6,<7"]

[project.scripts]
study-assistant = "study_assistant.app:main"
cortex = "study_assistant.app:main"

[tool.setuptools.packages.find]
include = ["study_assistant*"]
